<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ===== Brand tokens: عدّل الألوان هنا لتطابق الشعار الحالي ===== */
:root{--brand:#c8102e;--brand-d:#9e0c24;--ink:#14181f;--steel:#5b6573;--line:#e3e7ec;--bg:#fff;--soft:#f4f6f8;--dark:#0f1319;--r:14px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:Cairo,"Segoe UI",Tahoma,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:20px}
section{padding:72px 0}
.soft{background:var(--soft)}
h1,h2,h3{line-height:1.25}
h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800;margin-bottom:10px}
.sub{color:var(--steel);max-width:680px;margin-bottom:34px}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-weight:600;padding:12px 24px;border-radius:10px;background:var(--brand);color:#fff;transition:.2s}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:transparent;border:1.5px solid #fff}
.btn.ghost:hover{background:#fff;color:var(--ink)}
.btn.out{background:transparent;color:var(--ink);border:1.5px solid var(--line);padding:8px 16px;font-size:.9rem}
.btn.out:hover{border-color:var(--brand);color:var(--brand)}
.btn.out.on{background:var(--ink);color:#fff;border-color:var(--ink)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
/* header */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:18px;height:68px}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:.2px;margin-inline-end:auto}
.logo b{color:var(--brand)}
nav{display:flex;gap:18px;font-size:.95rem;font-weight:600}
nav a:hover{color:var(--brand)}
.lang{background:none;border:1.5px solid var(--line);border-radius:8px;padding:4px 12px;font:inherit;font-weight:600;cursor:pointer}
.burger{display:none;background:none;border:0;font-size:1.6rem;cursor:pointer}
/* hero */
.hero{background:linear-gradient(135deg,rgba(15,19,25,.94),rgba(15,19,25,.78)),repeating-linear-gradient(45deg,#1b222c 0 14px,#161c25 14px 28px);color:#fff;padding:110px 0 96px}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:800;max-width:760px}
.hero p{max-width:640px;margin:18px 0 30px;color:#d5dae1;font-size:1.1rem}
.hero .btn+.btn{margin-inline-start:10px}
.stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:50px;color:#c5ccd6;font-size:.95rem}
.stats b{display:block;color:#fff;font-size:1.05rem}
/* grids */
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;transition:.2s}
.card:hover{box-shadow:0 10px 28px rgba(20,24,31,.09);transform:translateY(-2px)}
.ic{width:46px;height:46px;border-radius:12px;background:#fdecef;color:var(--brand);display:grid;place-items:center;font-size:1.4rem;margin-bottom:14px}
.card h3{font-size:1.1rem;margin-bottom:6px}
.card p{color:var(--steel);font-size:.95rem}
.card .btn{margin-top:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
/* manufacturing */
.split{display:grid;gap:40px;grid-template-columns:1fr 1fr;align-items:center}
.list{list-style:none;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.list li::before{content:"✓";color:var(--brand);font-weight:800}
.panel{background:var(--dark);color:#fff;border-radius:var(--r);padding:36px}
.panel p{color:#c5ccd6}
.steps{counter-reset:s;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:10px}
.steps div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;counter-increment:s;font-weight:600}
.steps div::before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;margin-bottom:8px;font-size:.9rem}
/* form */
.formbox{display:grid;gap:36px;grid-template-columns:1.2fr .8fr}
form{display:grid;gap:14px}
label{font-weight:600;font-size:.92rem;display:grid;gap:4px}
input,select,textarea{font:inherit;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:0}
.row{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.err{color:var(--brand);font-size:.85rem;min-height:1.1em}
.basket{background:var(--soft);border-radius:var(--r);padding:22px;align-self:start}
.basket ul{list-style:none;padding:0;margin:10px 0}
.basket li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.basket li button{background:none;border:0;color:var(--brand);cursor:pointer;font-size:1.1rem}
.empty{color:var(--steel);font-size:.92rem}
.ok{background:#e8f6ee;border:1px solid #9bd3b2;border-radius:var(--r);padding:20px;display:none}
.ok.show{display:block}
footer{background:var(--dark);color:#aeb6c2;padding:40px 0;font-size:.92rem}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px}
.fab{position:fixed;inset-block-end:18px;inset-inline-start:18px;z-index:30;background:var(--brand);color:#fff;border-radius:999px;padding:12px 20px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media(max-width:860px){
 nav{display:none;position:absolute;top:68px;inset-inline:0;background:#fff;flex-direction:column;padding:16px 20px;border-bottom:1px solid var(--line)}
 nav.open{display:flex}.burger{display:block}
 .split,.formbox,.row{grid-template-columns:1fr}
 section{padding:52px 0}.hero{padding:70px 0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
/* ===== إعدادات التواصل: أضف رقم واتساب (دولي بدون +) وبريد الاستقبال ===== */
const CONFIG={whatsapp:"",email:""};
const CATS=[
 {id:"cooking",i:"🔥",ar:["معدات الطهي","أفران وغلايات وشوايات ومواقد."],en:["Cooking Equipment","Ovens, boilers, grills and ranges."]},
 {id:"cold",i:"❄️",ar:["التبريد والتجميد","ثلاجات وفريزرات وغرف تبريد."],en:["Refrigeration & Freezing","Fridges, freezers and cold rooms."]},
 {id:"steel",i:"🔩",ar:["ستانلس ستيل حسب الطلب","طاولات وأحواض ورفوف مصنّعة بالمقاس."],en:["Custom Stainless Steel","Tables, sinks and shelving made to size."]},
 {id:"wash",i:"🧼",ar:["غسيل الأطباق","ماكينات وأحواض غسيل مهنية."],en:["Dishwashing","Professional machines and sinks."]},
 {id:"prep",i:"🔪",ar:["تجهيز الطعام","خلاطات وقطاعات وعجانات."],en:["Food Preparation","Mixers, slicers and kneaders."]},
 {id:"hood",i:"🌀",ar:["الشفاطات والتهوية","هوود وأنظمة شفط وتهوية."],en:["Hoods & Ventilation","Extraction hoods and ventilation."]},
 {id:"bakery",i:"🥖",ar:["المخابز والحلويات","معدات تجهيز وخَبز."],en:["Bakery & Pastry","Prep and baking equipment."]},
 {id:"super",i:"🛍️",ar:["معدات السوبر ماركت","ثلاجات عرض وأقسام تجهيز."],en:["Supermarket Equipment","Display fridges and prep departments."]}
];
let lang=localStorage.getItem?.("ey_lang")||"ar",basket=[];
try{lang=localStorage.getItem("ey_lang")||"ar";basket=JSON.parse(localStorage.getItem("ey_basket")||"[]")}catch(e){}
const $=s=>document.querySelector(s),t=c=>c[lang==="ar"?"ar":"en"];
function save(){try{localStorage.setItem("ey_basket",JSON.stringify(basket));localStorage.setItem("ey_lang",lang)}catch(e){}}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function renderCats(){
 $("#cats").innerHTML=CATS.map(c=>{const on=basket.includes(c.id),x=t(c);
  return `<div class="card"><div class="ic">${c.i}</div><h3>${x[0]}</h3><p>${x[1]}</p><button class="btn out${on?" on":""}" data-add="${c.id}">${on?(lang==="ar"?"✓ في القائمة":"✓ Added"):(lang==="ar"?"أضف لقائمة الطلب":"Add to quote")}</button></div>`}).join("");
}
function renderBasket(){
 $("#basket").innerHTML=basket.map(id=>{const c=CATS.find(k=>k.id===id);return c?`<li><span>${c.i} ${t(c)[0]}</span><button data-rm="${id}" aria-label="remove">✕</button></li>`:""}).join("");
 $("#empty").style.display=basket.length?"none":"block";
 const f=$("#fab");f.hidden=!basket.length;f.textContent=(lang==="ar"?"📋 قائمة الطلب (":"📋 Quote list (")+basket.length+")";
}
function applyLang(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 document.querySelectorAll("[data-ar]").forEach(e=>e.textContent=e.dataset[lang]);
 $("#lang").textContent=lang==="ar"?"EN":"عربي";
 renderCats();renderBasket();save();
}
document.addEventListener("click",e=>{
 const a=e.target.closest("[data-add]"),r=e.target.closest("[data-rm]"),s=e.target.closest("[data-sector]");
 if(a){const id=a.dataset.add;basket=basket.includes(id)?basket.filter(x=>x!==id):[...basket,id];renderCats();renderBasket();save()}
 if(r){basket=basket.filter(x=>x!==r.dataset.rm);renderCats();renderBasket();save()}
 if(s)$("#sector").value=s.dataset.sector;
 if(e.target.closest("nav a"))$("#nav").classList.remove("open");
});
$("#lang").onclick=()=>{lang=lang==="ar"?"en":"ar";applyLang()};
$("#burger").onclick=()=>$("#nav").classList.toggle("open");
$("#yr").textContent=new Date().getFullYear();

$("#rfq").addEventListener("submit",e=>{
 e.preventDefault();
 const f=e.target,d=Object.fromEntries(new FormData(f)),errs={};
 const m=lang==="ar"?{r:"هذا الحقل مطلوب",p:"رقم هاتف غير صحيح",m:"بريد غير صحيح"}:{r:"Required",p:"Invalid phone",m:"Invalid email"};
 if(!d.name.trim())errs.name=m.r;
 if(!d.phone.trim())errs.phone=m.r;else if(!/^[+\d\s()-]{7,20}$/.test(d.phone.trim()))errs.phone=m.p;
 if(d.email&&!/^\S+@\S+\.\S+$/.test(d.email.trim()))errs.email=m.m;
 document.querySelectorAll(".err").forEach(x=>x.textContent=errs[x.dataset.f]||"");
 if(Object.keys(errs).length)return;
 const ref="EY-"+Date.now().toString(36).toUpperCase();
 const items=basket.map(id=>t(CATS.find(c=>c.id===id))[0]).join("، ");
 const sec=$("#sector").selectedOptions[0]?.textContent||"";
 const text=`Eyanza Trade RFQ ${ref}\nName: ${d.name}\nCompany: ${d.company}\nPhone: ${d.phone}\nEmail: ${d.email}\nSector: ${sec}\nItems: ${items||"-"}\nDetails: ${d.msg}`;
 const ok=$("#ok");
 ok.innerHTML=`<b>${lang==="ar"?"تم تجهيز طلبك. الرقم المرجعي:":"Your request is ready. Reference:"} ${esc(ref)}</b><p>${lang==="ar"?"سيتواصل معك فريقنا قريبًا.":"Our team will contact you shortly."}</p>`;
 ok.classList.add("show");
 if(CONFIG.whatsapp)window.open("https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(text),"_blank");
 else if(CONFIG.email)location.href="mailto:"+CONFIG.email+"?subject="+encodeURIComponent("RFQ "+ref)+"&body="+encodeURIComponent(text);
 f.reset();basket=[];renderCats();renderBasket();save();
});
applyLang();
</script>
</body>
</html>
